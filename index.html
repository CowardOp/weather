<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather API</title>
    <link rel="icon" href="../src/assets/icono api.png" type="image/x-icon" />
    <!-- <script src="https://cdn.tailwindcss.com"></script>npx tailwindcss init -->
    <link rel="stylesheet" href="../src/css/main.css" />
    <link rel="stylesheet" href="../src/css/style.css" />
   
  </head>
   <body class="flex items-center justify-center h-screen">
    <main class="w-full flex justify-center items-center px-4">
      <section
        class="container flex flex-col md:flex-row gap-6 bg-white/10 p-6 md:p-10 rounded-2xl shadow-2xl backdrop-blur-lg"
      >
        <!-- Panel izquierdo -->
        <div
          class="w-full md:w-2/4 flex flex-col justify-center items-center text-center gap-3"
        >
          <h1 class="title text-4xl font-bold text-blue-200">
            Buscador del Clima
          </h1>

          <div id="result" class="flex flex-col items-center gap-3">
            <p class="text-sm text-blue-100">Agregue ciudad y país</p>

            <h5 id="cityName" class="font-semibold text-2xl">
              Clima de -------
            </h5>

            <div
              class="flex justify-center items-center w-full h-[120px] mt-2 mb-2"
            >
              <img
                id="cityImg"
                alt="icono del clima"
                class="city-img transition-all duration-300"
              />
            </div>

            <h2
              id="cityTemp"
              class="text-6xl md:text-8xl font-bold drop-shadow-lg"
            >
              --°C
            </h2>
            <p id="cityMaxTemp" class="text-2xl md:text-4xl font-medium">
              Max: --°C
            </p>
            <p id="cityMinTemp" class="text-2xl md:text-4xl font-medium">
              Min: --°C
            </p>
          </div>
        </div>

        <!-- Formulario derecho -->
        <form
          id="getWeather"
          class="w-full md:w-2/4 flex flex-col gap-5 items-center justify-center"
        >
          <input
            class="input-text w-full outline-none text-black text-2xl rounded-xl px-4 py-2 shadow-md"
            type="text"
            name="city"
            id="city"
            placeholder="Indique la ciudad"
          />

          <select
            class="text-black text-xl w-full rounded-xl px-3 py-2 shadow-md"
            id="country"
          ></select>

          <input
            type="submit"
            value="Obtener Clima"
            class="submit bg-blue-600 hover:bg-blue-700 text-white text-xl font-semibold rounded-xl px-6 py-2 transition-all cursor-pointer shadow-md"
          />
        </form>
      </section>
    </main>

    <script src="../src/js/main.js"></script>
  </body>
</html>
